#cloud-config
package_update: true
package_upgrade: false
packages:
  - docker.io
  - docker-compose-plugin
  - git
  - python3.11
  - python3.11-venv
  - python3.11-dev
  - python3-pip
  - curl
  - build-essential
  - tmux
  - jq

runcmd:
  # Node 22 (for vite, mocks, func CLI)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
  # uv (Python package manager)
  - curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
  # Azure Functions Core Tools 4.9.0 (the working version) + Azurite
  - npm install -g azure-functions-core-tools@4.9.0 azurite --unsafe-perm true
  # Docker group for azureuser
  - usermod -aG docker azureuser
  - systemctl enable --now docker
  # Bootstrap readme
  - |
    cat > /home/azureuser/BOOT.md <<'EOF'
    === Zava Control Plane POC1 quick start ===
    # 1. Clone (repo is private — use a PAT or SSH)
    git clone https://github.com/arturcrmbot/zava-control-plane.git
    cd zava-control-plane/control-plane-py
    # 2. Install deps
    uv sync
    (cd ../control-plane && npm install)
    # 3. Boot in a tmux session (survives SSH disconnect)
    tmux new -s demo 'make up'
    # Reattach: tmux attach -t demo
    # Stop all: Ctrl-B D to detach, then `tmux kill-session -t demo`
    # 4. Open UI from your laptop
    # http://<this-vm-public-ip>:5273
    EOF
  - chown azureuser:azureuser /home/azureuser/BOOT.md
