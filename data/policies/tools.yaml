# MCP Tool Manifest (AGT)
# ===========================================================================
# Per plan/feature-agent-governance-toolkit-1.md TASK-009. This file is the
# CANONICAL declaration of every MCP tool the substrate calls. The kernel
# (api/server/services/governance/kernel.py) reads this manifest at boot via
# api/server/services/governance/manifest.py to (a) enumerate the tools the
# policy bundle covers and (b) extract per-call value/reversibility metadata
# for the policy decision context.
#
# Schema (validated by Pydantic in manifest.py):
#   id:                    canonical tool name (string, unique)
#   reversible:            true  if the call has no externally visible side
#                          effect (read-only / search / list / lookup / get).
#                          false if the call mutates external state.
#   requires_capability:   str | null — optional capability name that the
#                          calling agent must declare in its registry entry
#                          (Phase 5+).  null means no capability gate.
#   requires_authority:    true if the call needs an authority resolution
#                          (matrix.json) before execution. Phase 3 wires the
#                          kernel into the authority MCP fold-in.
#   value_field:           str | null — JSON-path inside ``args`` (dotted) at
#                          which the GBP value sits, e.g. ``claim.amount_gbp``.
#                          null if the call carries no monetary value.
#   scope_function:        the operating function ("finance" / "hiring" /
#                          "creative" / "shared") this tool belongs to.
#   description:           one-line human-facing description; surfaces in the
#                          policy bundle YAML and in the Control Plane chips.
#
# Reversibility convention (SEC-004):
#   *.write_*, *.submit_*, *.send_*, *.cancel_*, *.delete_*, *.create_*,
#   *.post*, *.book_*  ->  reversible: false
#   *.list_*, *.get_*, *.search_*, *.lookup_*, *.query_*, *.find_*,
#   *.check_*, *.resolve_*  ->  reversible: true
#
# AUDIT NOTE — provenance of this list (TASK-008):
#   - 47 server-side @traced_tool entries grepped from
#     api/server/mcp_tools/*.py via:
#       grep -rE '@traced_tool\(' api/server/mcp_tools/ --include='*.py'
#     last refresh: see this file's git log.
#   - Functions-side call_mcp call sites found in
#     api/functions/graphs/executors/deterministic/record_decision.py
#     (D365.postGLEntry).  Other Functions-side tools surface via the
#     Workday/Concur claim-management endpoints exercised in
#     tests/api/unit/test_workday_claim_endpoints.py and
#     tests/api/unit/test_concur_claim_endpoints.py — listed under the
#     "Functions-side / claim management" section below.
#
# DRY rule: the reversibility flag lives HERE and only here. Persona
# SKILL.md / agent SKILL.md may reference it (`see tools.yaml#X`) but
# may NOT carry a duplicate flag.
# ===========================================================================

