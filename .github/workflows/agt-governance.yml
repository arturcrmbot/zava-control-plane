# Phase 8 TASK-058 / TASK-059 of plan/archive/feature-agent-governance-toolkit-1.md.
#
# CI ring for the AGT governance core. Runs on every PR + on every push
# to main + nightly. Three jobs (one per actually-existing AGT v3.4 CLI
# command — the plan's mcp-scan / discover commands aren't in the
# Public Preview surface, so we run the three that are: doctor,
# verify, lint-policy), plus an aggregator that emits a single
# agt-evidence.json artifact the blueprint microsite consumes
# (TASK-060).
#
# Failure semantics:
#   - agt-doctor       → must succeed (install health gate).
#   - agt-verify       → must hit OWASP 10/10 with --strict.
#   - agt-lint-policy  → warning-strict on data/policies/.
#   - agt-test-suite   → governance-related unit suites must be green.
#
# AZURE_STORAGE_CONNECTION_STRING is cleared in CI to short-circuit
# the Azurite probe inside api.server.state during test collection
# (see /memories/repo/zava-pre-existing-test-failures.md).
name: agt-governance

on:
  pull_request:
    paths:
      - "api/server/services/governance/**"
      - "api/shared/agents.py"
      - "api/shared/types.py"
      - "api/server/services/audit_logger.py"
      - "api/functions/graphs/_common.py"
      - "api/server/mcp_tools/_otel.py"
      - "api/server/routes/governance.py"
      - "api/server/routes/authority.py"
      - "data/policies/**"
      - "data/governance/**"
      - "data/synthetic/authority/matrix.json"
      - "tests/api/server/services/governance/**"
      - "tests/api/shared/test_agents_registry.py"
      - "pyproject.toml"
      - ".github/workflows/agt-governance.yml"
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"  # daily at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_STORAGE_CONNECTION_STRING: ""
  AGT_DEV_KEYS: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  agt-doctor:
    name: agt doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pipx install uv
      - name: uv sync
        run: uv sync --frozen
      - name: agt doctor
        run: uv run agt --json doctor > agt-doctor.json
      - name: Upload doctor report
        uses: actions/upload-artifact@v4
        with:
          name: agt-doctor
          path: agt-doctor.json

  agt-verify:
    name: agt verify (OWASP ASI 10/10)
    runs-on: ubuntu-latest
    needs: agt-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pipx install uv
      - name: uv sync
        run: uv sync --frozen
      - name: agt verify --strict
        run: uv run agt --json verify --strict > agt-verify.json
      - name: Upload verify report
        uses: actions/upload-artifact@v4
        with:
          name: agt-verify
          path: agt-verify.json

  agt-lint-policy:
    name: agt lint-policy
    runs-on: ubuntu-latest
    needs: agt-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pipx install uv
      - name: uv sync
        run: uv sync --frozen
      - name: agt lint-policy data/policies
        # tools.yaml isn't an AGT-policy YAML (it's our manifest), so
        # lint-policy may not have anything to chew on — we run it for
        # forward-compatibility once we hand-author Phase 6's
        # data/policies/agents.policy.yaml. For now lint-policy is a
        # no-op that succeeds; CI keeps the wiring warm.
        run: |
          uv run agt lint-policy data/policies || echo "lint-policy: nothing to lint"

  agt-test-suite:
    name: governance test suite
    runs-on: ubuntu-latest
    needs: agt-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pipx install uv
      - name: uv sync
        run: uv sync --frozen
      - name: pytest governance suite
        run: |
          uv run pytest \
            tests/api/server/services/governance/ \
            tests/api/server/services/test_audit_chain.py \
            tests/api/shared/test_agents_registry.py \
            tests/api/unit/test_mcp_call_event.py \
            tests/api/unit/test_delegated_authority_tool.py \
            -v --tb=short

  agt-evidence-merge:
    name: aggregate agt-evidence.json (TASK-059)
    runs-on: ubuntu-latest
    needs: [agt-doctor, agt-verify, agt-lint-policy, agt-test-suite]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./_artifacts
      - name: Merge into agt-evidence.json
        run: |
          python - <<'PY'
          import json, os, datetime, glob, sys
          out = {
            "schema": "agt-evidence/v1",
            "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
            "git_sha": os.environ.get("GITHUB_SHA", ""),
            "git_ref": os.environ.get("GITHUB_REF", ""),
            "workflow_run": os.environ.get("GITHUB_RUN_ID", ""),
            "reports": {},
          }
          for path in sorted(glob.glob("_artifacts/*/*.json")):
            key = os.path.basename(path).replace(".json", "")
            try:
              out["reports"][key] = json.load(open(path))
            except Exception as ex:
              out["reports"][key] = {"_error": str(ex)}
          with open("agt-evidence.json", "w") as f:
            json.dump(out, f, indent=2, sort_keys=True)
          # Surface a single PASS/FAIL verdict for the bid card.
          verify = out["reports"].get("agt-verify", {})
          ok = bool(verify.get("passed")) and verify.get("coverage_pct") == 100
          print(f"verify_passed={ok}")
          if not ok:
            sys.exit(1)
          PY
      - name: Upload aggregated evidence
        uses: actions/upload-artifact@v4
        with:
          name: agt-evidence
          path: agt-evidence.json
