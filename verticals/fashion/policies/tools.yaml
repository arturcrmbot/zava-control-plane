version: 1
vertical: fashion
policies:
  inventory.transfer:
    auto_execute_when:
      max_retail_value_gbp: 10000
      max_quantity: 50
      owned_stock_only: true
      cross_border: false
      source_safety_stock_preserved: true
      expected_margin_exceeds_transfer_cost: true
      fairness_guardrail_passed: true
    approval_event: merchandising_director_decision
  markdown.recommend:
    approval_required: true
    mutates_price: false
  seller.offer.suppress:
    approval_required: true
  return.disposition:
    high_value_approval_required: true
