meta:
  vertical: fashion
  industry: fashion-retail
  geography:
    - UK
    - EU
  status: approved
  researched_at: "2026-07-20"
  evidence_policy: source-backed-industry-facts-only

facts:
  - id: uk-online-retail-series
    value: >-
      The UK Office for National Statistics maintains a Retail Sales Index
      internet-sales dataset and publishes revisions as additional data or
      method changes become available.
    confidence: high
    source_refs:
      - ons-retail-internet-sales
    design_relevance:
      - demand-spike-response
      - promotion-readiness
      - inventory-rebalancing

  - id: uk-distance-sale-reimbursement
    value: >-
      UK distance-sale reimbursement is due without undue delay and, for a
      sales contract where the trader does not collect the goods, no later
      than 14 days after the goods are received back or evidence of return is
      supplied.
    confidence: high
    source_refs:
      - uk-consumer-contracts-regulation-34
    design_relevance:
      - returns-disposition
      - fulfilment-exception-resolution

  - id: eu-marketplace-trader-transparency
    value: >-
      The EU Digital Services Act requires marketplaces to verify and display
      seller contact details, provides mechanisms to flag illegal goods, and
      requires greater marketplace product-traceability effort.
    confidence: high
    source_refs:
      - eu-digital-services-act
    design_relevance:
      - marketplace-seller-exception

  - id: eu-unsold-apparel-controls
    value: >-
      EU Ecodesign for Sustainable Products Regulation measures prohibit
      destruction of unsold apparel, clothing accessories, and footwear by
      large companies from 19 July 2026, with justified derogations and
      disclosure requirements; the Commission identifies resale,
      remanufacturing, donation, and reuse as alternatives.
    confidence: high
    source_refs:
      - eu-unsold-apparel-rules
    design_relevance:
      - markdown-governance
      - returns-disposition
      - inventory-rebalancing

  - id: uk-promotion-claim-transparency
    value: >-
      UK Competition and Markets Authority guidance says online urgency,
      scarcity, and price-reduction claims must be transparent and must not
      mislead consumers or create unfair pressure.
    confidence: high
    source_refs:
      - uk-cma-urgency-price-reductions
    design_relevance:
      - promotion-readiness
      - markdown-governance

uncertainties:
  - id: retailer-policy-thresholds
    statement: >-
      Public industry sources do not establish universal approval thresholds
      for transfer value, transfer quantity, safety stock, or recovered-margin
      ratios.
    treatment: Keep all thresholds explicit synthetic demo assumptions.

  - id: inventory-ownership-terms
    statement: >-
      Concession and marketplace inventory rights vary by retailer and partner
      contract.
    treatment: Model owned, concession, and marketplace rights separately and
      fail closed when ownership or commitment evidence is missing.

  - id: supplier-and-seller-slas
    statement: >-
      Supplier milestone and marketplace seller service levels are
      organisation-specific and are not inferred from public regulation.
    treatment: Use deterministic synthetic SLAs in the actor world.

  - id: cross-border-obligations
    statement: >-
      Tax, customs, product, and consumer obligations depend on route, product,
      operator role, and jurisdiction.
    treatment: Require human approval for cross-border actions and do not
      present the demo policy as legal advice.

  - id: enterprise-system-stack
    statement: >-
      A reusable industry pack has no verified retailer-specific ERP, OMS,
      WMS, PIM, marketplace, or returns platform.
    treatment: Expose typed pack-local MCP boundaries without naming a vendor.

exclusions:
  - No named retailer is profiled.
  - No synthetic actor, customer, seller, product, order, inventory, or event
    is represented as a researched fact.
  - No legal source is treated as a complete compliance determination.

