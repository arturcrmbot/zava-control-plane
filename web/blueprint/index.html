<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Why your agentic strategy isn't moving the needle — and what we think actually does." />
    <title>Why your agentic strategy isn't moving the needle</title>

    <!-- Canonical + Open Graph (for LinkedIn / Facebook / Slack unfurls). -->
    <!-- Absolute URLs are required by the OG spec; hard-coded to the GitHub
         Pages origin. Update both og:url and og:image when the canonical
         host moves (e.g. behind a custom domain or aka.ms link target). -->
    <link rel="canonical" href="https://arturcrmbot.github.io/zava-control-plane/" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Zava Control Plane" />
    <meta property="og:url" content="https://arturcrmbot.github.io/zava-control-plane/" />
    <meta property="og:title" content="Why your agentic strategy isn't moving the needle" />
    <meta property="og:description" content="Why your agentic strategy isn't moving the needle — and what we think actually does." />
    <meta property="og:image" content="https://arturcrmbot.github.io/zava-control-plane/og-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A medieval scriptorium beside a Gutenberg-era print shop — one volume hand-illuminated, the other set from reusable type." />
    <meta property="article:author" content="Artur Zielinski" />

    <!-- Twitter / X uses its own card namespace. summary_large_image gives
         the same wide-photo treatment as LinkedIn. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Why your agentic strategy isn't moving the needle" />
    <meta name="twitter:description" content="Why your agentic strategy isn't moving the needle — and what we think actually does." />
    <meta name="twitter:image" content="https://arturcrmbot.github.io/zava-control-plane/og-share.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
