# Hire-to-productive meta-workflow brief (Phase 4 IP5 TASK-023).
#
# Composes existing fleet HR + tech domains into one end-to-end joiner
# journey. Sub-orchestrator phases call the per-domain orchestrators
# already shipped under ``api/functions/workflows/``; HITL signoff is
# the manager confirming the onboarding plan.
domain:
  workflow_type: hire-to-productive
  prefix: fleet
  display_name: "Hire to Productive"
  description: "End-to-end joiner journey: fetch + IT access + onboarding + perf-review setup + manager signoff."
phases:
  - name: fetch_joiner
    kind: agent
    agent_skill_name: joiner-fetcher
    intent: "Fetch the joiner record from the entity graph for the workflow's employee_id."
  - name: it_access
    kind: sub_orchestrator
    target_workflow_type: it-access-request
    target_orchestrator: FleetItAccessRequestOrchestrator
    payload_from: "python:{'employee_id': input_dict['employee_id'], 'access_pack': 'joiner-default'}"
  - name: onboarding
    kind: sub_orchestrator
    target_workflow_type: employee-onboarding
    target_orchestrator: FleetEmployeeOnboardingOrchestrator
    parallel_group: onboarding
    payload_from: "python:{'employee_id': input_dict['employee_id']}"
  - name: perf_review_setup
    kind: sub_orchestrator
    target_workflow_type: perf-review
    target_orchestrator: FleetPerfReviewOrchestrator
    parallel_group: onboarding
    payload_from: "python:{'employee_id': input_dict['employee_id'], 'cycle': 'first-90-day'}"
  - name: manager_signoff
    kind: hitl
    persona: hr_bp
    external_event: manager_onboarding_plan_decision
function: hr
